<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 纯矢量，不用 emoji：emoji 由系统字体渲染，各平台长相不一。
       满幅背景不留透明边，maskable 场景下不会被裁出怪形状；
       内容集中在中心安全区内，各家启动器怎么裁都不会切到笔画。 -->
  <rect width="512" height="512" fill="#f2f2f7"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#007aff" stroke-width="22"/>
  <g stroke="#007aff" stroke-width="32" stroke-linecap="round" fill="none">
    <path d="M186 174 L256 246"/>
    <path d="M326 174 L256 246"/>
    <path d="M256 240 L256 339"/>
    <path d="M210 268 L302 268"/>
    <path d="M210 300 L302 300"/>
  </g>
</svg>
